name: Apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Applies never run in parallel and are never cancelled halfway.
concurrency:
  group: terraform-apply-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  apply:
    name: Apply envs/prod
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Requires the reviewer's approval, and only main may deploy to production.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-apply-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Init envs/prod
        run: terraform -chdir=envs/prod init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan envs/prod
        run: terraform -chdir=envs/prod plan -no-color -out=tfplan

      - name: Apply envs/prod
        run: terraform -chdir=envs/prod apply -no-color tfplan

      # The web and api pipelines depend on these parameters; fail here rather than in them.
      - name: Verify deploy parameters
        run: |
          expected="api-function app-url distribution-id products-table reconcile-function spa-bucket"
          actual="$(aws ssm get-parameters-by-path --path /checkout-app/prod/deploy \
            --query 'sort(Parameters[].Name)' --output text | tr '\t' '\n' | xargs -n1 basename | xargs)"
          echo "Deploy parameters: ${actual}"
          test "${actual}" = "${expected}"

      - name: Publish outputs
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          {
            echo "### Applied envs/prod"
            echo
            echo "- App: $(terraform -chdir=envs/prod output -raw app_url)"
            echo '```'
            terraform -chdir=envs/prod output -no-color | sed "s/${account_id}/<account-id>/g"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
