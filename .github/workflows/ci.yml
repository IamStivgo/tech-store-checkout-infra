name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  quality:
    name: Lint, validate and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      # The AWS provider is large; every root and module shares one download.
      - name: Configure provider plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Lint
        env:
          # Avoids GitHub API rate limits when downloading the AWS ruleset.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Validate bootstrap
        run: |
          terraform -chdir=bootstrap init -backend=false -lockfile=readonly
          terraform -chdir=bootstrap validate

      - name: Validate envs/prod
        run: |
          terraform -chdir=envs/prod init -backend=false -lockfile=readonly
          terraform -chdir=envs/prod validate

      - name: Test modules
        run: bash scripts/test-modules.sh

  plan:
    name: Terraform plan
    needs: quality
    # Fork and Dependabot pull requests get no OIDC token for this repository's roles.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      # The OIDC subject of a pull_request job is repo:<owner>/<repo>:pull_request, the only
      # one the read-only plan role trusts.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Init envs/prod
        run: terraform -chdir=envs/prod init -lockfile=readonly -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Plan envs/prod
        env:
          TF_VAR_payment_api_base_url: ${{ secrets.PAYMENT_API_BASE_URL }}
          TF_VAR_payment_public_key: ${{ secrets.PAYMENT_PUBLIC_KEY }}
          TF_VAR_origin_verify_secret: ${{ secrets.ORIGIN_VERIFY_SECRET }}
        run: |
          terraform -chdir=envs/prod plan -no-color -out=tfplan
          terraform -chdir=envs/prod show -no-color tfplan > plan.txt

      # The repository is public: the account ID is replaced before the plan is published.
      - name: Comment plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          sed -i "s/${account_id}/<account-id>/g" plan.txt
          summary="$(grep -E '^(Plan:|No changes)' plan.txt | head -n 1)"
          {
            echo "### Terraform plan: envs/prod"
            echo
            echo "**${summary:-See the full plan}**"
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file comment.md
