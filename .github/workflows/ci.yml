name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  quality:
    name: Lint, validate and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      # The AWS provider is large; every root and module shares one download.
      - name: Configure provider plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Lint
        env:
          # Avoids GitHub API rate limits when downloading the AWS ruleset.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Validate bootstrap
        run: |
          terraform -chdir=bootstrap init -backend=false -lockfile=readonly
          terraform -chdir=bootstrap validate

      - name: Validate envs/prod
        run: |
          terraform -chdir=envs/prod init -backend=false -lockfile=readonly
          terraform -chdir=envs/prod validate

      - name: Test modules
        run: bash scripts/test-modules.sh
