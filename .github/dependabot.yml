version: 2

updates:
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /envs/prod
      - /modules/*
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
